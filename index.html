<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>DAI Reflex 10,000 Levels</title><script src="https://telegram.org"></script><script src="https://jsdelivr.net"></script><style>body{font-family:system-ui,sans-serif;background:#090d16;color:#f8fafc;margin:0;padding:14px;text-align:center}.box{max-width:480px;margin:0 auto 14px;background:#131b2e;border:1px solid #263554;border-radius:14px;padding:16px}button{background:#16a34a;color:#fff;border:none;padding:12px 16px;border-radius:10px;font-weight:bold;font-size:15px;cursor:pointer;width:100%;margin-top:8px}button.blue{background:#2563eb}button.gold{background:#d97706}button:disabled{background:#334155;cursor:not-allowed}#arena{position:relative;height:240px;background:#060911;border:2px solid #2563eb;border-radius:12px;overflow:hidden;margin:12px 0}#target{position:absolute;border-radius:50%;background:radial-gradient(circle,#4ade80,#16a34a);box-shadow:0 0 18px #4ade80;cursor:pointer;display:none}.row{display:flex;justify-content:space-between;font-size:14px;font-weight:bold;margin-bottom:6px}.bal{font-size:26px;color:#4ade80;font-weight:800;margin:6px 0}.small{font-size:12px;color:#94a3b8;word-break:break-all}.badge{background:#1e293b;border:1px solid #38bdf8;color:#38bdf8;padding:4px 10px;border-radius:20px;font-size:13px;font-weight:bold}input{width:92%;padding:9px;margin:4px 0;border-radius:8px;border:1px solid #334155;background:#090d16;color:#fff}</style></head><body><div class="box"><h2>DAI Reflex Arena (10,000 Levels)</h2><div id="walletTxt" class="small">Connect wallet to save levels & earn DAI</div><button class="blue" onclick="connectWallet()">1. Connect Wallet (Base Network)</button><div class="bal" id="daiBal">$0.0000 DAI</div><button id="withdrawBtn" onclick="withdrawDai()" disabled>2. Withdraw DAI ($1.00 Min)</button><div id="statusTxt" class="small" style="margin-top:8px"></div></div><div class="box"><div class="row"><span class="badge">Level <b id="lvlNum">1</b> / 10,000</span><span>Goal: <b id="goalTxt">45</b> pts</span></div><div class="row"><span>Score: <b id="score">0</b></span><span>Highest Level: <b id="maxLvl">1</b></span><span>Time: <b id="timer">20</b>s</span></div><div id="arena"><div id="target" onclick="hitTarget()"></div></div><button id="playBtn" onclick="handlePlayClick(1,5)">Play Level 1 (FREE)</button><button id="bundleBtn" class="blue" onclick="handlePlayClick(10,50)">Unlock 10-Level Bundle ($50.00 DAI)</button></div><div class="box"><h4>Share Invite Link</h4><div id="refLink" class="small">Connect wallet to get your referral link</div><button class="blue" onclick="copyRef()">Copy Invite Link</button></div><div class="box"><h4>Creator Profit Sweep (To Personal MetaMask)</h4><input id="adminKeyIn" type="password" placeholder="Admin Key"/><input id="metaAddrIn" type="text" placeholder="Your MetaMask 0x... Address"/><input id="sweepAmtIn" type="number" placeholder="Amount DAI"/><button class="gold" onclick="sweepProfit()">Send Profit DAI to My MetaMask</button><div id="sweepStatus" class="small" style="margin-top:6px"></div></div>
