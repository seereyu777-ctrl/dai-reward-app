<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/><title>DAI Reflex 10,000 Levels</title><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script><style>body{font-family:system-ui,sans-serif;background:#090d16;color:#f8fafc;margin:0;padding:14px;text-align:center}.box{max-width:480px;margin:0 auto 14px;background:#131b2e;border:1px solid #263554;border-radius:14px;padding:16px}button{background:#16a34a;color:#fff;border:none;padding:12px 16px;border-radius:10px;font-weight:bold;font-size:15px;cursor:pointer;width:100%;margin-top:8px}button.blue{background:#2563eb}button.gold{background:#d97706}button:disabled{background:#334155;cursor:not-allowed}#arena{position:relative;height:240px;background:#060911;border:2px solid #2563eb;border-radius:12px;overflow:hidden;margin:12px 0;touch-action:manipulation}#target{position:absolute;border-radius:50%;background:radial-gradient(circle,#4ade80,#16a34a);box-shadow:0 0 18px #4ade80;cursor:pointer;display:none;transition:left 0.15s linear,top 0.15s linear}.row{display:flex;justify-content:space-between;font-size:14px;font-weight:bold;margin-bottom:6px}.bal{font-size:26px;color:#4ade80;font-weight:800;margin:6px 0}.small{font-size:12px;color:#94a3b8;word-break:break-all}.badge{display:inline-block;background:#1e293b;border:1px solid #38bdf8;color:#38bdf8;padding:4px 10px;border-radius:20px;font-size:13px;font-weight:bold}</style></head><body><div class="box"><h2 style="margin:0 0 6px">DAI Reflex Arena (10,000 Levels)</h2><div id="walletTxt" class="small">Connect wallet to save levels & earn DAI</div><button class="blue" onclick="connectWallet()">1. Connect Wallet (Base Network)</button><div class="bal" id="daiBal">$0.0000 DAI</div><button id="withdrawBtn" onclick="withdrawDai()" disabled>2. Withdraw DAI ($1.00 Min)</button><div id="statusTxt" class="small" style="margin-top:8px"></div></div><div class="box"><div class="row"><span class="badge">Level <b id="lvlNum">1</b> / 10,000</span><span>Goal: <b id="goalTxt">50</b> pts</span></div><div class="row"><span>Score: <b id="score">0</b></span><span>Highest Level: <b id="maxLvl">1</b></span><span>Time: <b id="timer">20</b>s</span></div><div id="arena"><div id="target" onclick="hitTarget()"></div></div><button id="playBtn" onclick="handlePlayClick()">Play Level 1 (FREE)</button><button id="bundleBtn" class="blue" onclick="buyBundle(10,50)">Unlock 10-Level Bundle ($50.00 DAI)</button></div><div class="box"><h4 style="margin:0 0 6px">Share Invite Link</h4><div id="refLink" class="small">Connect wallet to get your referral link</div><button class="blue" onclick="copyRef()">Copy Invite Link</button></div><div class="box"><h4 style="margin:0 0 6px">Creator Profit Sweep (To Personal MetaMask)</h4><input id="adminKeyIn" type="password" placeholder="Admin Key (my_admin_password_123)" style="width:92%;padding:9px;margin:4px 0;border-radius:8px;border:1px solid #334155;background:#090d16;color:#fff"/><input id="metaAddrIn" type="text" placeholder="Your Personal MetaMask 0x... Address" style="width:92%;padding:9px;margin:4px 0;border-radius:8px;border:1px solid #334155;background:#090d16;color:#fff"/><input id="sweepAmtIn" type="number" placeholder="Amount DAI to Withdraw (e.g. 50)" style="width:92%;padding:9px;margin:4px 0;border-radius:8px;border:1px solid #334155;background:#090d16;color:#fff"/><button class="gold" onclick="sweepProfit()">Send Profit DAI to My MetaMask</button><div id="sweepStatus" class="small" style="margin-top:6px"></div></div><script>if(window.Telegram?.WebApp){window.Telegram.WebApp.ready();window.Telegram.WebApp.expand()}const API_URL="https://dai-agent.onrender.com",VAULT_ADDRESS="0xCF1e58E6eA0BDFf97Fe6856b46Fd094B66613DcE",DAI_ADDRESS="0x1c907B4870F1C09C261b6760131438f47b52e2a1",TREASURY_ADDRESS="0xE52E9dF5d3563E9D957b2Ffe0c4d478E74342DE4",VAULT_ABI=["function claimReward(uint256 amount,bytes32 voucherId,uint256 deadline,bytes signature) external"],ERC20_ABI=["function transfer(address to,uint256 amount) returns (bool)"];let userAddress="",currentLevel=1,maxUnlocked=Number(localStorage.getItem("max_lvl")||1),score=0,timeLeft=20,loop=null,moveLoop=null;updateLevelUI();function getDeviceId(){let i=localStorage.getItem("app_device_id");if(!i){i="dev_"+Math.random().toString(36).substring(2,15);localStorage.setItem("app_device_id",i)}return i}function getLevelConfig(l){return{goal:Math.min(250,40+5*l),size:Math.max(26,58-Math.floor(l/200)),autoJumpMs:Math.max(450,2200-15*l)}}function updateLevelUI(){const c=getLevelConfig(currentLevel);document.getElementById("lvlNum").innerText=currentLevel;document.getElementById("goalTxt").innerText=c.goal;document.getElementById("maxLvl").innerText=maxUnlocked;const b=document.getElementById("playBtn");if(1===currentLevel)b.className="",b.innerText="Play Level 1 (FREE)";else if(currentLevel<=maxUnlocked)b.className="",b.innerText="Start Level "+currentLevel+" (Unlocked)";else b.className="gold",b.innerText="Pay $5.00 DAI GAME PASS - Unlock Level "+currentLevel}async function connectWallet(){if(!window.ethereum)return alert("Open inside MetaMask, Coinbase Wallet, or Trust Wallet browser.");const p=new ethers.BrowserProvider(window.ethereum),s=await p.getSigner();userAddress=await s.getAddress();document.getElementById("walletTxt").innerText="Player: "+userAddress.slice(0,6)+"..."+userAddress.slice(-4);document.getElementById("refLink").innerText=window.location.origin+window.location.pathname+"?ref="+userAddress;const r=await fetch(API_URL+"/api/register-player",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({userAddress,deviceId:getDeviceId()})}),d=await r.json();if(d.player){const b=Number(d.player.dai_balance);document.getElementById("daiBal").innerText="$"+b.toFixed(4)+" DAI";document.getElementById("withdrawBtn").disabled=b<1}}async function buyBundle(lvls,usd){window._bundleLvls=lvls;window._bundleUsd=usd;await handlePlayClick();window._bundleLvls=1;window._bundleUsd=5}async function handlePlayClick(){if(1===currentLevel||currentLevel<=maxUnlocked)return startLevelMatch();if(!userAddress)return alert("Connect your wallet first");const st=document.getElementById("statusTxt");try{st.innerText="Confirm $5.00 DAI payment in your wallet...";const p=new ethers.BrowserProvider(window.ethereum),s=await p.getSigner(),dai=new ethers.Contract(DAI_ADDRESS,ERC20_ABI,s),tx=await dai.transfer(TREASURY_ADDRESS,ethers.parseUnits(String(window._bundleUsd||5),18));st.innerText="Verifying $5.00 DAI transaction on-chain...";const rc=await tx.wait(),r=await fetch(API_URL+"/api/enter-tournament",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({userAddress,txHash:rc.hash})}),d=await r.json();if(!r.ok)throw new Error(d.error);maxUnlocked=Math.min(10000,currentLevel+(window._bundleLvls||1)-1);localStorage.setItem("max_lvl",maxUnlocked);st.innerText="Level "+currentLevel+" Unlocked! Starting match...";updateLevelUI();startLevelMatch()}catch(e){st.innerText="Unlock failed: "+(e.reason||e.message)}}function startLevelMatch(){const c=getLevelConfig(currentLevel);score=0;timeLeft=20;document.getElementById("score").innerText=score;document.getElementById("timer").innerText=timeLeft;document.getElementById("playBtn").disabled=!0;const t=document.getElementById("target");t.style.width=c.size+"px";t.style.height=c.size+"px";moveTarget();clearInterval(moveLoop);moveLoop=setInterval(moveTarget,c.autoJumpMs);clearInterval(loop);loop=setInterval(()=>{timeLeft--;document.getElementById("timer").innerText=timeLeft;if(timeLeft<=0){clearInterval(loop);clearInterval(moveLoop);t.style.display="none";document.getElementById("playBtn").disabled=!1;if(score>=c.goal&&currentLevel<10000){currentLevel++;document.getElementById("statusTxt").innerText="LEVEL CLEARED! Ready for Level "+currentLevel}else document.getElementById("statusTxt").innerText="Time up! Need "+c.goal+" pts to pass Level "+currentLevel;updateLevelUI()}},1000)}function moveTarget(){const a=document.getElementById("arena"),t=document.getElementById("target"),s=parseInt(t.style.width||"50",10);t.style.left=Math.floor(Math.random()*(a.clientWidth-s-6))+"px";t.style.top=Math.floor(Math.random()*(a.clientHeight-s-6))+"px";t.style.display="block"}function hitTarget(){score+=10;document.getElementById("score").innerText=score;moveTarget()}function copyRef(){navigator.clipboard.writeText(document.getElementById("refLink").innerText);alert("Referral link copied!"i}async function sweepProfit(){const k=document.getElementById("adminKeyIn").value,t=document.getElementById("metaAddrIn").value.trim(),a=document.getElementById("sweepAmtIn").value,s=document.getElementById("sweepStatus");try{s.innerText="Sending "+a+" DAI to your MetaMask...";const r=await fetch(API_URL+"/api/admin/withdraw-profit",{method:"POST",headers:{"Content-Type":"application/json","x-admin-key":k},body:JSON.stringify({toAddress:t,amountDai:a})}),d=await r.json();if(!r.ok)throw new Error(d.error);s.innerText="SENT! "+d.sentDai+" DAI delivered. Tx: "+d.txHash}catch(e){s.innerText="Sweep Error: "+e.message}}async function withdrawDai(){const st=document.getElementById("statusTxt");try{st.innerText="Signing payout voucher...";const r=await fetch(API_URL+"/api/withdraw-dai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({userAddress})}),v=await r.json();if(!r.ok)throw new Error(v.error);const p=new ethers.BrowserProvider(window.ethereum),s=await p.getSigner(),vault=new ethers.Contract(VAULT_ADDRESS,VAULT_ABI,s),tx=await vault.claimReward(v.amount,v.voucherId,v.deadline,v.signature);st.innerText="Sending DAI on-chain...";const rc=await tx.wait();document.getElementById("daiBal").innerText="$0.0000 DAI";document.getElementById("withdrawBtn").disabled=!0;st.innerText="PAID Tx: "+rc.hash}catch(e){st.innerText="Error: "+(e.reason||e.message)}}</script></body></html>
