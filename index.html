<!DOCTYPE html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>DAI Reflex 10,000</title><script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script><style>body{font-family:sans-serif;background:#070b14;color:#fff;padding:15px;text-align:center}.box{max-width:460px;margin:0 auto 14px;background:#111827;border:1px solid #1f2937;border-radius:14px;padding:16px}button{background:#10b981;color:#fff;border:none;padding:12px;border-radius:10px;font-weight:bold;width:100%;margin-top:8px;cursor:pointer;font-size:15px}button.blue{background:#2563eb}button.gold{background:#f59e0b;color:#111}button:disabled{background:#374151;color:#9ca3af}#arena{position:relative;height:240px;background:#050811;border:2px solid #2563eb;border-radius:12px;overflow:hidden;margin:10px 0}#target{position:absolute;width:54px;height:54px;border-radius:50%;background:#10b981;cursor:pointer;display:none}.row{display:flex;justify-content:space-between;font-weight:bold;margin-bottom:6px;font-size:13px}input{width:92%;padding:9px;margin:4px 0;border-radius:8px;border:1px solid #374151;background:#090e1a;color:#fff}</style></head><body><div class="box"><div class="row"><span>DAI Reflex Arena</span><span id="netBadge" style="color:#fbbf24">Connecting...</span></div><div id="wTxt" style="font-size:12px;color:#9ca3af">Auto-detecting wallet...</div><div id="balTxt" style="font-size:26px;color:#10b981;font-weight:bold;margin:8px 0">$0.0000 DAI</div><button id="connBtn" class="blue" onclick="connect(true)">Connect Wallet</button><button id="wBtn" onclick="withdraw()" disabled>Withdraw DAI ($1 Min)</button><div id="stTxt" style="font-size:12px;color:#60a5fa;margin-top:6px"></div></div><div class="box"><div class="row"><span>Level <b id="lNum">1</b>/10,000</span><span>Goal: <b id="gNum">45</b></span><span>Time: <b id="tNum">20</b>s</span></div><div class="row"><span>Score: <b id="sNum">0</b></span><span>Unlocked: <b id="mNum">1</b></span></div><div id="arena"><div id="target" onclick="hit()"></div></div><button id="pBtn" onclick="play(1,5)">Play Level 1 (FREE)</button><button class="gold" onclick="play(10,50)">Unlock 10-Level Bundle ($50 DAI)</button></div><div class="box"><h4>Creator Profit Sweep</h4><input id="kIn" type="password" placeholder="Admin Key"/><input id="aIn" placeholder="Your MetaMask 0x... Address"/><input id="vIn" type="number" placeholder="Amount DAI"/><button class="gold" onclick="sweep()">Send Profit to MetaMask</button><div id="swTxt" style="font-size:12px;margin-top:6px"></div></div><script>const API="https://dai-agent.onrender.com",VAULT="0xCF1e58E6eA0BDFf97Fe6856b46Fd094B66613DcE",DAI="0x1c907B4870F1C09C261b6760131438f47b52e2a1",TREASURY="0xE52E9dF5d3563E9D957b2Ffe0c4d478E74342DE4";let addr="",lvl=1,maxL=Number(localStorage.getItem("ml")||1),sc=0,tm=20,t1,t2,playing=false;function ping(){fetch(API+"/api/health").then(r=>{if(r.ok){const b=document.getElementById("netBadge");b.innerText="Online";b.style.color="#10b981";}}).catch(()=>{});}ping();setInterval(ping,600000);function ui(){const g=Math.min(250,40+5*lvl);document.getElementById("lNum").innerText=lvl;document.getElementById("gNum").innerText=g;document.getElementById("mNum").innerText=maxL;const b=document.getElementById("pBtn");b.innerText=lvl===1?"Play Level 1 (FREE)":(lvl<=maxL?"Start Level "+lvl:"Pay $5 DAI - Unlock Level "+lvl);b.className=lvl<=maxL?"":"gold";}ui();async function connect(ask){const w=document.getElementById("wTxt"),cb=document.getElementById("connBtn");if(!window.ethereum){w.innerText="Open inside MetaMask browser";if(ask)alert("Install MetaMask extension or open in MetaMask app");return;}try{const acc=await window.ethereum.request({method:ask?"eth_requestAccounts":"eth_accounts"});if(!acc||!acc.length){w.innerText="Click Connect Wallet";return;}addr=acc[0];w.innerText="Connected: "+addr.slice(0,6)+"..."+addr.slice(-4);cb.innerText="Connected";cb.disabled=true;fetch(API+"/api/register-player",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({userAddress:addr,deviceId:"web_"+addr.slice(2,10)})}).then(r=>r.json()).then(d=>{const p=Array.isArray(d.player)?d.player[0]:d.player;if(p){const b=Number(p.dai_balance);document.getElementById("balTxt").innerText="$"+b.toFixed(4)+" DAI";document.getElementById("wBtn").disabled=b<1;}}).catch(()=>{});}catch(e){if(ask)document.getElementById("stTxt").innerText=e.message;}}window.onload=()=>{connect(false);setTimeout(()=>{if(!playing&&lvl===1)run();},500);};async function play(n,usd){if(n===1&&lvl<=maxL)return run();if(!addr){await connect(true);if(!addr)return;}const st=document.getElementById("stTxt");try{st.innerText="Confirm $"+usd+" DAI in MetaMask...";const p=new ethers.BrowserProvider(window.ethereum),s=await p.getSigner(),c=new ethers.Contract(DAI,["function transfer(address,uint256) returns(bool)"],s),tx=await c.transfer(TREASURY,ethers.parseUnits(String(usd),18));st.innerText="Verifying...";const rc=await tx.wait(),r=await fetch(API+"/api/enter-tournament",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({userAddress:addr,txHash:rc.hash})}),d=await r.json();if(!r.ok)throw new Error(d.error);maxL=Math.min(10000,Math.max(maxL,lvl)+n-1);localStorage.setItem("ml",maxL);st.innerText="Unlocked Level "+maxL;ui();run();}catch(e){st.innerText="Error: "+(e.reason||e.message);}}function run(){playing=true;const g=Math.min(250,40+5*lvl),sz=Math.max(26,58-Math.floor(lvl/200)),spd=Math.max(450,2200-15*lvl);sc=0;tm=20;document.getElementById("sNum").innerText=0;document.getElementById("tNum").innerText=20;document.getElementById("pBtn").disabled=true;const t=document.getElementById("target");t.style.width=sz+"px";t.style.height=sz+"px";jmp();clearInterval(t2);t2=setInterval(jmp,spd);clearInterval(t1);t1=setInterval(()=>{tm--;document.getElementById("tNum").innerText=tm;if(tm<=0){clearInterval(t1);clearInterval(t2);playing=false;t.style.display="none";document.getElementById("pBtn").disabled=false;if(sc>=g&&lvl<10000){lvl++;ui();if(lvl<=maxL){document.getElementById("stTxt").innerText="CLEARED! Next level...";setTimeout(run,1000);}else document.getElementById("stTxt").innerText="CLEARED! Unlock Level "+lvl;}else{document.getElementById("stTxt").innerText="Need "+g+" pts to pass.";ui();}}},1000);}function jmp(){const a=document.getElementById("arena"),t=document.getElementById("target"),s=parseInt(t.style.width);t.style.left=Math.floor(Math.random()*Math.max(10,a.clientWidth-s-6))+"px";t.style.top=Math.floor(Math.random()*Math.max(10,a.clientHeight-s-6))+"px";t.style.display="block";}function hit(){sc+=10;document.getElementById("sNum").innerText=sc;jmp();}async function withdraw(){const st=document.getElementById("stTxt");try{const r=await fetch(API+"/api/withdraw-dai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({userAddress:addr})}),v=await r.json();if(!r.ok)throw new Error(v.error);const p=new ethers.BrowserProvider(window.ethereum),s=await p.getSigner(),c=new ethers.Contract(VAULT,["function claimReward(uint256,bytes32,uint256,bytes)"],s),tx=await c.claimReward(v.amount,v.voucherId,v.deadline,v.signature);await tx.wait();st.innerText="DAI Paid!";}catch(e){st.innerText="Error: "+(e.reason||e.message);}}async function sweep(){const st=document.getElementById("swTxt");try{const r=await fetch(API+"/api/admin/withdraw-profit",{method:"POST",headers:{"Content-Type":"application/json","x-admin-key":document.getElementById("kIn").value},body:JSON.stringify({toAddress:document.getElementById("aIn").value.trim(),amountDai:document.getElementById("vIn").value})}),d=await r.json();if(!r.ok)throw new Error(d.error);st.innerText="Sent "+d.sentDai+" DAI! Tx: "+d.txHash;}catch(e){st.innerText="Error: "+e.message;}}</script></body></html>
