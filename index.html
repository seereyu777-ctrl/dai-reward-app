<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DAI Reflex Arena | 10,000-Level Web3 Skill Game on Base</title>
  <script src="https://telegram.org"></script>
  <script src="https://jsdelivr.net"></script>
  <style>
    :root { --bg: #070b14; --card: #111827; --border: #1f2937; --primary: #2563eb; --accent: #10b981; --gold: #f59e0b; --text: #f9fafb; --muted: #9ca3af; }
    * { box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: radial-gradient(circle at top, #0f172a, var(--bg)); color: var(--text); margin: 0; padding: 16px; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 460px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.45); }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .title { font-size: 19px; font-weight: 800; margin: 0; letter-spacing: -0.3px; }
    .pill { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: #064e3b; color: #34d399; border: 1px solid #059669; }
    .pill.wait { background: #451a03; color: #fbbf24; border-color: #d97706; }
    .balance-box { background: #090e1a; border: 1px solid #1e293b; border-radius: 12px; padding: 12px; text-align: center; margin: 10px 0; }
    .balance { font-size: 28px; font-weight: 900; color: var(--accent); }
    .sub { font-size: 12px; color: var(--muted); word-break: break-all; }
    .btn { width: 100%; padding: 13px 16px; border: none; border-radius: 11px; font-size: 15px; font-weight: 700; cursor: pointer; color: #fff; background: var(--accent); transition: transform 0.1s, opacity 0.15s; margin-top: 8px; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { background: #374151; color: #9ca3af; cursor: not-allowed; }
    .btn-blue { background: var(--primary); }
    .btn-gold { background: linear-gradient(135deg, #f59e0b, #d97706); color: #111827; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stats-bar { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; background: #090e1a; padding: 10px 12px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #1e293b; }
    #arena { position: relative; height: 250px; background: radial-gradient(circle, #0b132b, #050811); border: 2px solid #2563eb; border-radius: 14px; overflow: hidden; margin: 10px 0; touch-action: manipulation; user-select: none; }
    #target { position: absolute; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #6ee7b7, #10b981); box-shadow: 0 0 22px rgba(16,185,129,0.85); cursor: pointer; display: none; }
    .toggle-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); margin-top: 8px; }
    input { width: 100%; padding: 10px 12px; margin: 5px 0; border-radius: 9px; border: 1px solid #374151; background: #090e1a; color: #fff; font-size: 13px; }
    .status { font-size: 12px; color: #60a5fa; text-align: center; margin-top: 8px; min-height: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <!-- WALLET & STANDBY HEADER -->
    <div class="card">
      <div class="header">
        <h1 class="title">DAI Reflex Arena</h1>
        <span id="netBadge" class="pill wait">Standby • Connecting...</span>
      </div>
      <div id="walletTxt" class="sub">Auto-detecting Web3 wallet...</div>
      <div class="balance-box">
        <div class="sub">Available Reward Balance</div>
        <div id="daiBal" class="balance">$0.0000 DAI</div>
      </div>
      <div class="grid-2">
        <button id="connBtn" class="btn btn-blue" onclick="connectWallet(true)">Connect Wallet</button>
        <button id="withdrawBtn" class="btn" onclick="withdrawDai()" disabled>Withdraw ($1 Min)</button>
      </div>
      <div id="statusTxt" class="status"></div>
    </div>

    <!-- 10,000-LEVEL AUTO-PLAY ARENA -->
    <div class="card">
      <div class="stats-bar">
        <span>Level <b id="lvlNum" style="color:#38bdf8">1</b> / 10,000</span>
        <span>Goal: <b id="goalTxt" style="color:#34d399">45</b> pts</span>
        <span>Time: <b id="timer" style="color:#fbbf24">20</b>s</span>
      </div>
      <div class="stats-bar">
        <span>Score: <b id="score">0</b></span>
        <span>Unlocked: <b id="maxLvl">1</b></span>
        <span>Speed: <b id="spdTxt">1.0x</b></span>
      </div>
      <div id="arena"><div id="target" onclick="hitTarget()"></div></div>
      <button id="playBtn" class="btn" onclick="handlePlayClick(1, 5)">Play Level 1 (FREE)</button>
      <button id="bundleBtn" class="btn btn-gold" onclick="handlePlayClick(10, 50)">Unlock 10-Level Bundle ($50.00 DAI)</button>
      <div class="toggle-row">
        <span>Auto-Play Next Unlocked Level</span>
        <input id="autoPlayChk" type="checkbox" checked style="width:auto;margin:0;" />
      </div>
    </div>

    <!-- REFERRAL & CREATOR SWEEP -->
    <div class="card">
      <div class="header"><h3 class="title" style="font-size:15px">Player Invite Link</h3></div>
      <div id="refLink" class="sub">Connect wallet to generate invite link</div>
      <button class="btn btn-blue" onclick="copyRef()">Copy Referral Link</button>
    </div>

    <div class="card">
      <div class="header"><h3 class="title" style="font-size:15px">Creator Profit Sweep</h3></div>
      <input id="adminKeyIn" type="password" placeholder="Admin Key" />
      <input id="metaAddrIn" type="text" placeholder="Personal MetaMask 0x... Address" />
      <input id="sweepAmtIn" type="number" placeholder="DAI Amount to Sweep" />
      <button class="btn btn-gold" onclick="sweepProfit()">Send Profit DAI to MetaMask</button>
      <div id="sweepStatus" class="status"></div>
    </div>
  </div>

<script>
  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }

  const API_URL = 'https://onrender.com';
  const VAULT_ADDRESS = '0xCF1e58E6eA0BDFf97Fe6856b46Fd094B66613DcE';
  const DAI_ADDRESS = '0x1c907B4870F1C09C261b6760131438f47b52e2a1';
  const TREASURY_ADDRESS = '0xE52E9dF5d3563E9D957b2Ffe0c4d478E74342DE4';
  const TARGET_CHAIN_HEX = '0x14a34'; // 84532 Base Sepolia (use '0x2105' for 8453 Base Mainnet)

  const VAULT_ABI = ['function claimReward(uint256 amount, bytes32 voucherId, uint256 deadline, bytes signature) external'];
  const ERC20_ABI = ['function transfer(address to, uint256 amount) returns (bool)'];

  let userAddress = '';
  let currentLevel = 1;
  let maxUnlocked = Number(localStorage.getItem('max_lvl') || 1);
  let score = 0;
  let timeLeft = 20;
  let loop = null;
  let moveLoop = null;
  let isPlaying = false;

  // 1. STANDBY KEEP-ALIVE ENGINE (Pings backend immediately & every 10 mins)
  async function keepServerAlive() {
    const badge = document.getElementById('netBadge');
    try {
      const r = await fetch(API_URL + '/api/health');
      if (r.ok) {
        badge.className = 'pill';
        badge.innerText = 'Online • Base Ready';
      }
    } catch (e) {
      badge.className = 'pill wait';
      badge.innerText = 'Standby • Waking API';
    }
  }
  keepServerAlive();
  setInterval(keepServerAlive, 600000);

  function getDeviceId() {
    let id = localStorage.getItem('app_device_id');
    if (!id) {
      id = 'dev_' + Math.random().toString(36).substring(2, 15);
      localStorage.setItem('app_device_id', id);
    }
    return id;
  }

  function getLevelConfig(lvl) {
    return {
      goal: Math.min(250, 40 + 5 * lvl),
      size: Math.max(26, 58 - Math.floor(lvl / 200)),
      autoJumpMs: Math.max(450, 2200 - 15 * lvl)
    };
  }

  function updateLevelUI() {
    const c = getLevelConfig(currentLevel);
    document.getElementById('lvlNum').innerText = currentLevel;
    document.getElementById('goalTxt').innerText = c.goal;
    document.getElementById('maxLvl').innerText = maxUnlocked;
    document.getElementById('spdTxt').innerText = (2200 / c.autoJumpMs).toFixed(1) + 'x';
    const b = document.getElementById('playBtn');
    if (currentLevel === 1) {
      b.className = 'btn';
      b.innerText = 'Play Level 1 (FREE)';
    } else if (currentLevel <= maxUnlocked) {
      b.className = 'btn';
      b.innerText = 'Start Level ' + currentLevel + ' (Unlocked)';
    } else {
      b.className = 'btn btn-gold';
      b.innerText = 'Pay $5.00 DAI • Unlock Level ' + currentLevel;
    }
  }
  updateLevelUI();

  // 2. AUTO-CONNECT & AUTO-SWITCH TO BASE NETWORK
  async function connectWallet(manualClick = false) {
    const wTxt = document.getElementById('walletTxt');
    const connBtn = document.getElementById('connBtn');
    if (!window.ethereum) {
      wTxt.innerText = 'No Web3 wallet found. Open in MetaMask or Coinbase Wallet.';
      if (manualClick) alert('Install MetaMask extension or open inside MetaMask mobile browser.');
      return;
    }
    try {
      const method = manualClick ? 'eth_requestAccounts' : 'eth_accounts';
      const accounts = await window.ethereum.request({ method });
      if (!accounts || accounts.length === 0) {
        wTxt.innerText = 'Wallet ready • Click Connect Wallet to start';
        return;
      }
      userAddress = accounts;
      wTxt.innerText = 'Connected: ' + userAddress.slice(0, 6) + '...' + userAddress.slice(-4);
      connBtn.innerText = 'Wallet Connected';
      connBtn.disabled = true;
      document.getElementById('refLink').innerText = window.location.origin + window.location.pathname + '?ref=' + userAddress;

      // Auto-switch to Base network if on wrong chain
