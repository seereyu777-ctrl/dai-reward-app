<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAI Reflex 10,000 Levels</title>
  <script src="https://telegram.org"></script>
  <script src="https://jsdelivr.net"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #090d16; color: #f8fafc; margin: 0; padding: 14px; text-align: center; }
    .box { max-width: 480px; margin: 0 auto 14px; background: #131b2e; border: 1px solid #263554; border-radius: 14px; padding: 16px; }
    button { background: #16a34a; color: #fff; border: none; padding: 12px 16px; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; width: 100%; margin-top: 8px; }
    button.blue { background: #2563eb; }
    button.gold { background: #d97706; }
    button:disabled { background: #334155; cursor: not-allowed; }
    #arena { position: relative; height: 240px; background: #060911; border: 2px solid #2563eb; border-radius: 12px; overflow: hidden; margin: 12px 0; user-select: none; }
    #target { position: absolute; border-radius: 50%; background: #4ade80; box-shadow: 0 0 18px #4ade80; cursor: pointer; display: none; }
    .row { display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; margin-bottom: 6px; }
    .bal { font-size: 26px; color: #4ade80; font-weight: 800; margin: 6px 0; }
    .small { font-size: 12px; color: #94a3b8; word-break: break-all; }
    .badge { background: #1e293b; border: 1px solid #38bdf8; color: #38bdf8; padding: 4px 10px; border-radius: 20px; font-size: 13px; font-weight: bold; }
    input { width: 92%; padding: 9px; margin: 4px 0; border-radius: 8px; border: 1px solid #334155; background: #090d16; color: #fff; }
  </style>
</head>
<body>
  <div class="box">
    <h2>DAI Reflex Arena (10,000 Levels)</h2>
    <div id="walletTxt" class="small">Connect wallet to save levels & earn DAI</div>
    <button class="blue" onclick="connectWallet()">1. Connect Wallet (Base Network)</button>
    <div class="bal" id="daiBal">$0.0000 DAI</div>
    <button id="withdrawBtn" onclick="withdrawDai()" disabled>2. Withdraw DAI ($1.00 Min)</button>
    <div id="statusTxt" class="small" style="margin-top:8px"></div>
  </div>

  <div class="box">
    <div class="row">
      <span class="badge">Level <b id="lvlNum">1</b> / 10,000</span>
      <span>Goal: <b id="goalTxt">45</b> pts</span>
    </div>
    <div class="row">
      <span>Score: <b id="score">0</b></span>
      <span>Highest Level: <b id="maxLvl">1</b></span>
      <span>Time: <b id="timer">20</b>s</span>
    </div>
    <div id="arena"><div id="target" onclick="hitTarget()"></div></div>
    <button id="playBtn" onclick="handlePlayClick(1, 5)">Play Level 1 (FREE)</button>
    <button id="bundleBtn" class="blue" onclick="handlePlayClick(10, 50)">Unlock 10-Level Bundle ($50.00 DAI)</button>
  </div>

  <div class="box">
    <h4>Share Invite Link</h4>
    <div id="refLink" class="small">Connect wallet to get your referral link</div>
    <button class="blue" onclick="copyRef()">Copy Invite Link</button>
  </div>

  <div class="box">
    <h4>Creator Profit Sweep (To Personal MetaMask)</h4>
    <input id="adminKeyIn" type="password" placeholder="Admin Key" />
    <input id="metaAddrIn" type="text" placeholder="Your MetaMask 0x... Address" />
    <input id="sweepAmtIn" type="number" placeholder="Amount DAI" />
    <button class="gold" onclick="sweepProfit()">Send Profit DAI to My MetaMask</button>
    <div id="sweepStatus" class="small" style="margin-top:6px"></div>
  </div>

<script>
  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }

  const API_URL = 'https://onrender.com';
  const VAULT_ADDRESS = '0xCF1e58E6eA0BDFf97Fe6856b46Fd094B66613DcE';
  const DAI_ADDRESS = '0x1c907B4870F1C09C261b6760131438f47b52e2a1';
  const TREASURY_ADDRESS = '0xE52E9dF5d3563E9D957b2Ffe0c4d478E74342DE4';

  const VAULT_ABI = ['function claimReward(uint256 amount, bytes32 voucherId, uint256 deadline, bytes signature) external'];
  const ERC20_ABI = ['function transfer(address to, uint256 amount) returns (bool)'];

  let userAddress = '';
  let currentLevel = 1;
  let maxUnlocked = Number(localStorage.getItem('max_lvl') || 1);
  let score = 0;
  let timeLeft = 20;
  let loop = null;
  let moveLoop = null;

  function getDeviceId() {
    let id = localStorage.getItem('app_device_id');
    if (!id) {
      id = 'dev_' + Math.random().toString(36).substring(2, 15);
      localStorage.setItem('app_device_id', id);
    }
    return id;
  }

  function getLevelConfig(lvl) {
    return {
      goal: Math.min(250, 40 + 5 * lvl),
      size: Math.max(26, 58 - Math.floor(lvl / 200)),
      autoJumpMs: Math.max(450, 2200 - 15 * lvl)
    };
  }

  function updateLevelUI() {
    const c = getLevelConfig(currentLevel);
    document.getElementById('lvlNum').innerText = currentLevel;
    document.getElementById('goalTxt').innerText = c.goal;
    document.getElementById('maxLvl').innerText = maxUnlocked;
    const b = document.getElementById('playBtn');
    if (currentLevel === 1) {
      b.className = '';
      b.innerText = 'Play Level 1 (FREE)';
    } else if (currentLevel <= maxUnlocked) {
      b.className = '';
      b.innerText = 'Start Level ' + currentLevel + ' (Unlocked)';
    } else {
      b.className = 'gold';
      b.innerText = 'Pay $5.00 DAI - Unlock Level ' + currentLevel;
    }
  }
  updateLevelUI();

  async function connectWallet() {
    if (!window.ethereum) return alert('Install MetaMask extension first or open inside MetaMask mobile browser.');
    try {
      const provider = new ethers.BrowserProvider(window.ethereum);
      const signer = await provider.getSigner();
      userAddress = await signer.getAddress();
      document.getElementById('walletTxt').innerText = 'Player: ' + userAddress.slice(0, 6) + '...' + userAddress.slice(-4);
      document.getElementById('refLink').innerText = window.location.origin + window.location.pathname + '?ref=' + userAddress;

      const r = await fetch(API_URL + '/api/register-player', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userAddress, deviceId: getDeviceId() })
      });
      const d = await r.json();
      if (d.player) {
        const bal = Number(d.player.dai_balance);
        document.getElementById('daiBal').innerText = '$' + bal.toFixed(4) + ' DAI';
        document.getElementById('withdrawBtn').disabled = bal < 1;
      }
    } catch (e) {
      alert('Wallet error: ' + (e.reason || e.message));
    }
  }

  async function handlePlayClick(lvls, usd) {
    if (lvls === 1 && (currentLevel === 1 || currentLevel <= maxUnlocked)) {
      return startLevelMatch();
    }
    if (!userAddress) return alert('Click 1. Connect Wallet first!');
    const st = document.getElementById('statusTxt');
    try {
      st.innerText = 'Confirm $' + usd + '.00 DAI in MetaMask...';
      const provider = new ethers.BrowserProvider(window.ethereum);
      const signer = await provider.getSigner();
      const dai = new ethers.Contract(DAI_ADDRESS, ERC20_ABI, signer);
      const tx = await dai.transfer(TREASURY_ADDRESS, ethers.parseUnits(String(usd), 18));
      st.innerText = 'Verifying on-chain...';
      const rc = await tx.wait();

      const r = await fetch(API_URL + '/api/enter-tournament', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userAddress, txHash: rc.hash })
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error);

      maxUnlocked = Math.min(10000, Math.max(maxUnlocked, currentLevel) + lvls - 1);
      localStorage.setItem('max_lvl', maxUnlocked);
      st.innerText = 'Unlocked up to Level ' + maxUnlocked + '!';
      updateLevelUI();
      startLevelMatch();
    } catch (e) {
      st.innerText = 'Unlock failed: ' + (e.reason || e.message);
    }
  }

  function startLevelMatch() {
    const c = getLevelConfig(currentLevel);
    score = 0;
    timeLeft = 20;
    document.getElementById('score').innerText = score;
    document.getElementById('timer').innerText = timeLeft;
    document.getElementById('playBtn').disabled = true;

    const t = document.getElementById('target');
    t.style.width = c.size + 'px';
    t.style.height = c.size + 'px';
    moveTarget();

    clearInterval(moveLoop);
    moveLoop = setInterval(moveTarget, c.autoJumpMs);
    clearInterval(loop);
    loop = setInterval(() => {
      timeLeft--;
      document.getElementById('timer').innerText = timeLeft;
      if (timeLeft <= 0) {
        clearInterval(loop);
        clearInterval(moveLoop);
        t.style.display = 'none';
        document.getElementById('playBtn').disabled = false;
        if (score >= c.goal && currentLevel < 10000) {
          currentLevel++;
          document.getElementById('statusTxt').innerText = 'LEVEL CLEARED! Ready for Level ' + currentLevel;
        } else {
          document.getElementById('statusTxt').innerText = 'Time up! Need ' + c.goal + ' pts to pass.';
        }
        updateLevelUI();
      }
    }, 1000);
  }

  function moveTarget() {
    const a = document.getElementById('arena');
    const t = document.getElementById('target');
    const s = parseInt(t.style.width || '50', 10);
    t.style.left = Math.floor(Math.random() * (a.clientWidth - s - 6)) + 'px';
    t.style.top = Math.floor(Math.random() * (a.clientHeight - s - 6)) + 'px';
    t.style.display = 'block';
  }

  function hitTarget() {
    score += 10;
    document.getElementById('score').innerText = score;
    moveTarget();
  }

  function copyRef() {
    if (!userAddress) return alert('Connect wallet first!');
    navigator.clipboard.writeText(document.getElementById('refLink').innerText);
    alert('Invite link copied!');
  }
